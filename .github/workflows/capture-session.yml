name: Capture session checks

on:
  pull_request:
    paths:
      - "src/chibi_audio/capture_session.py"
      - "src/chibi_audio/cli.py"
      - "tests/test_capture_session.py"
      - "tests/test_bridge_capture_policy.py"
      - "docs/capture-signal-points.md"
      - ".github/workflows/capture-session.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .
      - name: Run repository tests
        run: python -m pytest -q
