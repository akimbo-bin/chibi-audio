name: Analysis fabric

on:
  push:
    branches:
      - feat/analysis-fabric-8
    paths:
      - "src/chibi_audio/analysis/**"
      - "tests/test_analysis_*.py"
      - ".github/workflows/analysis-fabric.yml"
  pull_request:
    paths:
      - "src/chibi_audio/analysis/**"
      - "tests/test_analysis_*.py"
      - ".github/workflows/analysis-fabric.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[analysis]' pytest 'librosa>=1,<2'
      - run: python -m compileall -q src/chibi_audio/analysis
      - run: pytest -q tests/test_analysis_fabric.py tests/test_analysis_manifest.py
