[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chibi-audio"
version = "0.0.1"
description = "Read-only Ableton project intelligence and future Chibi production tooling"
requires-python = ">=3.11"

[project.optional-dependencies]
analysis = ["numpy>=1.26"]
mcp = ["mcp>=2.1,<3"]

[project.scripts]
chibi-audio = "chibi_audio.cli:main"
chibi-audio-mcp = "chibi_audio.mcp_server_perception:main"

[tool.setuptools.packages.find]
where = ["src"]
